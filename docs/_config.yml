# GitHub Pages setting: Deploy from a branch -> main -> / (root)
# index.md in the repository root is the website entry file.
#
# docs/ holds an identical copy of the site. It was used briefly as an
# alternative publishing source while the first root deployment timed out on
# GitHub's side. Pages now deploys from the root, so docs/ is a mirror only.
theme: jekyll-theme-cayman
title: ZHU Qinyi — Data Science Portfolio
description: Data analysis portfolio for CISC7204, City University of Macau
show_downloads: false

# Files that should not be copied into the published site.
exclude:
  - .gitignore
  - Gemfile
  - Gemfile.lock

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter: rouge
