# Configures the site published from the /docs folder.
# GitHub Pages setting: Deploy from a branch -> main -> /docs
theme: jekyll-theme-cayman
title: ZHU Qinyi — Data Science Portfolio
description: Data analysis portfolio for CISC7204, City University of Macau
show_downloads: false

# Files that should not be copied into the published site.
exclude:
  - .gitignore
  - Gemfile
  - Gemfile.lock

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter: rouge
